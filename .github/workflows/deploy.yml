name: CI/CD Production Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck / Lint
        run: npm run lint

      - name: Execute Test Suite
        run: npm test --if-present

      - name: Build Frontend & Backend
        run: npm run build

  deploy:
    name: Continuous Deployment to AWS EC2
    needs: validate
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 via Native SSH
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST || '100.58.158.253' }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "ℹ️ EC2_SSH_KEY secret is not configured in GitHub Secrets. Skipping automated deployment."
            exit 0
          fi

          echo "🚀 Connecting to AWS EC2 ($EC2_HOST)..."
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "
            set -e
            echo '🚀 Starting automated deployment on AWS EC2...'
            if [ -d '/home/ubuntu/Mail2Whatsapp-Ai' ]; then
              cd /home/ubuntu/Mail2Whatsapp-Ai
            elif [ -d '/home/ubuntu/mail2whatsapp-ai' ]; then
              cd /home/ubuntu/mail2whatsapp-ai
            fi
            git pull origin master
            npm install --production=false
            npm run build
            npm run lint
            pm2 reload mail2whatsapp || pm2 restart mail2whatsapp || true
            echo '✅ Deployment successfully completed!'
          "
