name: CI/CD Production Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck / Lint
        run: npm run lint

      - name: Execute Test Suite
        env:
          NODE_ENV: test
          CI: "true"
        run: npm test

      - name: Build Frontend & Backend
        run: npm run build

  deploy:
    name: Continuous Deployment to AWS EC2
    needs: validate
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 via Native SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: whatsapp2mail.duckdns.org
          EC2_USER: ubuntu
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "ℹ️ EC2_SSH_KEY secret is not configured in GitHub Secrets. Skipping automated deployment."
            exit 0
          fi

          echo "🚀 Connecting to AWS EC2 ($EC2_HOST)..."
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" 'bash -s' < scripts/deploy-ec2.sh
