name: CI/CD Production Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck / Lint
        run: npm run lint

      - name: Execute Test Suite
        run: npm test --if-present

      - name: Build Frontend & Backend
        run: npm run build

  deploy:
    name: Continuous Deployment to AWS EC2
    needs: validate
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        if: ${{ secrets.EC2_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || '3.80.187.41' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            echo "🚀 Starting automated deployment on AWS EC2..."
            if [ -d "/home/ubuntu/mail2whatsapp-ai" ]; then
              cd /home/ubuntu/mail2whatsapp-ai
            elif [ -d "/home/ubuntu/Mail2Whatsapp-Ai" ]; then
              cd /home/ubuntu/Mail2Whatsapp-Ai
            fi
            git pull origin master
            npm install --production=false
            npm run build
            npm run lint
            pm2 reload mail2whatsapp || pm2 restart mail2whatsapp || npm run start &
            echo "✅ Deployment successfully executed!"
